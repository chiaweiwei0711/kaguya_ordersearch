# Netlify Configuration File
# Reference: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory to change to before starting a build.
  # This is where we will look for package.json/.nvmrc/etc.
  base = "/"

  # Directory that contains the deploy-ready HTML files and assets generated by the build.
  publish = "dist"

  # Default build command.
  command = "npm run build"

# The following redirect is intended for use with most SPAs that handle routing internally.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html 不快取 → 每次都拿到最新版前端（她電腦看不到新版的問題）
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 帶 hash 的 JS/CSS 可以永久快取（檔名變了就是新版）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
