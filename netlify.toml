# Netlify Configuration File
# Reference: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory to change to before starting a build.
  # This is where we will look for package.json/.nvmrc/etc.
  base = "/"

  # Directory that contains the deploy-ready HTML files and assets generated by the build.
  publish = "dist"

  # Default build command.
  command = "npm run build"

# Netlify 原始網址導回正式網域。
# 客人開 kaguyagoods-order-search.netlify.app 會被 LIFF 判成「測試站」而改用測試 LIFF，
# 但那支註冊的是 main-- 開頭的網址 → 對不上 → LINE 回 400 Bad Request（2026-09-29 客人回報）。
# main-- 開頭的預覽站不受影響，驗收照舊。
[[redirects]]
  from = "https://kaguyagoods-order-search.netlify.app/*"
  to = "https://kgygoods.com/:splat"
  status = 301
  force = true

# The following redirect is intended for use with most SPAs that handle routing internally.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html 不快取 → 每次都拿到最新版前端（她電腦看不到新版的問題）
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 帶 hash 的 JS/CSS 可以永久快取（檔名變了就是新版）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
